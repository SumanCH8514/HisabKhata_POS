name = "hisabkhata-pos-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ─── Custom Domain Route ──────────────────────────────────────────────────────
routes = [
  { pattern = "api.pos.hisabkhata.sumanonline.com", custom_domain = true }
]

# ─── D1 Database Binding ──────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"                    # accessed in Worker as c.env.DB
database_name = "hisabkhata-pos_d1_db"
database_id = "35620317-eea3-479f-916c-53e48783eb4c"   # wrangler d1 create pos_d1_db

# ─── R2 Bucket Binding ───────────────────────────────────────────────────────
[[r2_buckets]]
binding = "MY_POS_BUCKET"        # accessed in Worker as c.env.MY_POS_BUCKET
bucket_name = "hisabkhata-pos"
preview_bucket_name = "hisabkhata-pos"

# ─── CORS / dev proxy ────────────────────────────────────────────────────────
[dev]
port = 8787
local_protocol = "http"
