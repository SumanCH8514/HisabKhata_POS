  <script>
    (function () {
      try {
        const theme = localStorage.getItem('theme') || 'system';
        const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      } catch {}
    })();
  </script>

  <style id="splash-screen-style">
    :root {
      --splash-bg: #f8fafc;
      --splash-text: #0f172a;
      --splash-subtext: #64748b;
      --splash-brand-glow: rgba(16, 185, 129, 0.12);
      --splash-dot: #10b981;
    }
    html.dark {
      --splash-bg: #090d16 !important;
      --splash-text: #f8fafc !important;
      --splash-subtext: #94a3b8 !important;
      --splash-brand-glow: rgba(16, 185, 129, 0.25) !important;
      --splash-dot: #34d399 !important;
    }
    html.light {
      --splash-bg: #f8fafc !important;
      --splash-text: #0f172a !important;
      --splash-subtext: #64748b !important;
      --splash-brand-glow: rgba(16, 185, 129, 0.12) !important;
      --splash-dot: #10b981 !important;
    }

    #app-splash-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: var(--splash-bg);
      color: var(--splash-text);
      z-index: 9999999;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 48px 24px calc(32px + env(safe-area-inset-bottom, 0px)) 24px;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: auto;
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #app-splash-screen.splash-fade-out {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .splash-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .splash-logo-box {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      max-width: 280px;
      width: 78%;
      animation: splashPulse 2.4s ease-in-out infinite;
    }

    .splash-logo-img {
      width: 100%;
      height: auto;
      max-height: 84px;
      object-fit: contain;
      filter: drop-shadow(0 10px 25px var(--splash-brand-glow));
    }

    /* Strict deterministic theme-specific logo switching */
    html.dark #splash-logo-light { display: none !important; }
    html.dark #splash-logo-dark { display: block !important; }
    html.light #splash-logo-light { display: block !important; }
    html.light #splash-logo-dark { display: none !important; }

    /* Default fallback before JS runs */
    @media (prefers-color-scheme: dark) {
      html:not(.light):not(.dark) {
        --splash-bg: #090d16;
        --splash-text: #f8fafc;
        --splash-subtext: #94a3b8;
        --splash-brand-glow: rgba(16, 185, 129, 0.25);
        --splash-dot: #34d399;
      }
      html:not(.light):not(.dark) #splash-logo-light { display: none !important; }
      html:not(.light):not(.dark) #splash-logo-dark { display: block !important; }
    }
    html:not(.dark):not(.light) #splash-logo-light { display: block; }
    html:not(.dark):not(.light) #splash-logo-dark { display: none; }

    .splash-loader {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 32px;
    }

    .splash-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--splash-dot);
      opacity: 0.3;
      animation: splashBounce 1.4s infinite ease-in-out both;
    }

    .splash-dot:nth-child(1) { animation-delay: -0.32s; }
    .splash-dot:nth-child(2) { animation-delay: -0.16s; }
    .splash-dot:nth-child(3) { animation-delay: 0s; }

    .splash-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-top: 20px;
    }

    .splash-brandname {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--splash-text);
      margin: 0;
      line-height: 1.3;
    }

    .splash-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: var(--splash-subtext);
      margin-top: 4px;
      margin-bottom: 0;
      line-height: 1.3;
    }

    @keyframes splashPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    @keyframes splashBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
      40% { transform: scale(1.15); opacity: 1; }
    }
  </style>

  <script>
    (function () {
      function applyDynamicSplash() {
        try {
          const theme = localStorage.getItem('theme') || 'system';
          const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }

          const compRaw = localStorage.getItem('cached_company');
          if (compRaw) {
            const comp = JSON.parse(compRaw);
            if (comp) {
              // Custom company logo support
              if (comp.logo_url && comp.logo_url.trim()) {
                const box = document.querySelector('.splash-logo-box');
                if (box) {
                  box.innerHTML = '<img id="splash-custom-logo" src="' + comp.logo_url.trim() + '" alt="' + (comp.name || 'Brand Logo') + '" class="splash-logo-img" style="max-height: 96px; object-fit: contain;" />';
                }
              }
              // Custom company name support
              if (comp.name && comp.name.trim()) {
                const titleEl = document.getElementById('splash-brand-title');
                const subEl = document.getElementById('splash-brand-sub');
                if (titleEl) titleEl.textContent = comp.name.trim().toUpperCase();
                if (subEl) subEl.textContent = 'Powered by HisabKhata POS';
              }
            }
          }
        } catch {}
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyDynamicSplash);
      } else {
        applyDynamicSplash();
      }

      window.addEventListener('theme_changed', applyDynamicSplash);
      window.addEventListener('hk_theme_changed', applyDynamicSplash);
      window.addEventListener('storage', applyDynamicSplash);
    })();
  </script>

    </div>

    <div class="splash-footer">
      <p id="splash-brand-title" class="splash-brandname">HISABKHATA POS</p>
